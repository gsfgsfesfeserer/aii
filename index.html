<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebLLM Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0a0a0a;
            --bg-panel: #111111;
            --bg-input: #161616;
            --border: #242424;
            --text: #e8e8e8;
            --text-dim: #8a8a8a;
            --text-muted: #555555;
            --accent: #ff6b1a;
            --accent-dim: #cc5515;
            --accent-deep: #ff4500;
            --accent-light: #ffb066;
            --accent-glow: rgba(255, 107, 26, 0.25);
            --grad-accent: linear-gradient(135deg, #ff4500 0%, #ff6b1a 50%, #ffb066 100%);
            --grad-dark: linear-gradient(180deg, #161616 0%, #0a0a0a 100%);
            --grad-panel: linear-gradient(180deg, #141414 0%, #0d0d0d 100%);
        }

        html, body { overflow: hidden; }

        body {
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
            position: relative;
            cursor: crosshair;
        }

        body::before {
            content: '';
            position: fixed;
            inset: -20%;
            background:
                radial-gradient(circle at 20% 30%, rgba(255, 69, 0, 0.14), transparent 35%),
                radial-gradient(circle at 80% 70%, rgba(255, 107, 26, 0.12), transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 176, 102, 0.06), transparent 55%);
            pointer-events: none;
            z-index: 0;
            animation: bgShift 12s ease-in-out infinite alternate;
        }

        @keyframes bgShift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 0.7; }
            33% { transform: translate(3%, -2%) scale(1.08) rotate(2deg); opacity: 1; }
            66% { transform: translate(-2%, 3%) scale(1.05) rotate(-1deg); opacity: 0.9; }
            100% { transform: translate(2%, -3%) scale(1.1) rotate(3deg); opacity: 0.85; }
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 107, 26, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 107, 26, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(circle at 50% 50%, black 20%, transparent 70%);
            -webkit-mask-image: radial-gradient(circle at 50% 50%, black 20%, transparent 70%);
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 40px 40px, 40px 40px; }
        }

        .scanline {
            position: fixed;
            top: -100%;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg,
                transparent,
                rgba(255, 107, 26, 0.6),
                rgba(255, 176, 102, 0.9),
                rgba(255, 107, 26, 0.6),
                transparent);
            pointer-events: none;
            z-index: 5;
            filter: blur(1px);
            animation: scan 8s linear infinite;
            opacity: 0.5;
        }

        @keyframes scan {
            0% { top: -5%; opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { top: 105%; opacity: 0; }
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 6px var(--accent);
            opacity: 0;
            animation: float linear infinite;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) translateX(var(--drift, 0px)) scale(1); opacity: 0; }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
        }

        .orb-1 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #ff4500, transparent 70%);
            top: -100px; left: -100px;
            animation: orbFloat1 18s ease-in-out infinite;
        }

        .orb-2 {
            width: 250px; height: 250px;
            background: radial-gradient(circle, #ff6b1a, transparent 70%);
            bottom: -80px; right: -80px;
            animation: orbFloat2 22s ease-in-out infinite;
        }

        .orb-3 {
            width: 200px; height: 200px;
            background: radial-gradient(circle, #ffb066, transparent 70%);
            top: 40%; left: 50%;
            animation: orbFloat3 25s ease-in-out infinite;
        }

        @keyframes orbFloat1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(200px, 150px) scale(1.3); }
        }
        @keyframes orbFloat2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-180px, -120px) scale(1.2); }
        }
        @keyframes orbFloat3 {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-30%, -70%) scale(1.4); }
        }

        .app {
            width: 100%;
            max-width: 880px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: var(--grad-panel);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            z-index: 2;
            box-shadow: 0 0 100px rgba(255, 69, 0, 0.10), 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: appBreath 5s ease-in-out infinite;
        }

        @keyframes appBreath {
            0%, 100% { box-shadow: 0 0 80px rgba(255, 69, 0, 0.04), 0 20px 60px rgba(0, 0, 0, 0.5); }
            50% { box-shadow: 0 0 120px rgba(255, 69, 0, 0.15), 0 20px 60px rgba(0, 0, 0, 0.5); }
        }

        .app::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%, var(--accent-deep) 20%, var(--accent-light) 40%,
                #fff 50%, var(--accent-light) 60%, var(--accent-deep) 80%, transparent 100%);
            background-size: 300% 100%;
            animation: topLine 3s linear infinite;
            z-index: 11;
            opacity: 0.9;
        }

        @keyframes topLine {
            0% { background-position: 300% 0; }
            100% { background-position: -300% 0; }
        }

        .header {
            padding: 14px 20px;
            background: linear-gradient(180deg, #181818 0%, #121212 100%);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            position: relative;
            z-index: 2;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }

        .brand h1 {
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: var(--grad-accent);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradShift 4s ease infinite;
        }

        @keyframes gradShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .controls select {
            background: var(--grad-dark);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 7px 10px;
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            max-width: 260px;
            transition: border-color 0.2s, box-shadow 0.3s;
        }

        .controls select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(255, 107, 26, 0.2);
        }

        .controls button {
            background: transparent;
            color: var(--text-dim);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 7px 14px;
            font-size: 0.78rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s;
            text-transform: uppercase;
        }

        .controls button:hover {
            color: var(--accent);
            border-color: var(--accent);
            box-shadow: 0 0 18px rgba(255, 107, 26, 0.3);
        }

        .controls button:active { transform: scale(0.94); }
        .controls button:disabled { opacity: 0.3; cursor: not-allowed; }

        .status {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 2px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status::before {
            content: '';
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .status.online {
            color: var(--accent);
            border-color: var(--accent-dim);
        }
        .status.online::before {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .status.loading {
            color: #ffb066;
            border-color: #553311;
        }
        .status.loading::before {
            background: #ffb066;
            animation: pulse 0.7s ease-in-out infinite;
        }

        .status.offline {
            color: #ff4444;
            border-color: #552222;
        }
        .status.offline::before {
            background: #ff4444;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.6); }
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 1;
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 69, 0, 0.04), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 107, 26, 0.03), transparent 50%);
        }

        #messages::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: var(--grad-accent); border-radius: 2px; }

        .message {
            display: flex;
            gap: 14px;
            max-width: 88%;
            animation: messageIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes messageIn {
            0% { opacity: 0; transform: translateY(15px) scale(0.96); filter: blur(6px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .message.user { align-self: flex-end; flex-direction: row-reverse; }
        .message.assistant { align-self: flex-start; }

        .message .avatar {
            width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 700; letter-spacing: 1px;
            flex-shrink: 0; border-radius: 2px; font-family: inherit;
        }

        .message.user .avatar {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent-dim);
        }

        .message.assistant .avatar {
            background: var(--grad-accent);
            color: var(--bg);
            box-shadow: 0 0 16px rgba(255, 107, 26, 0.4);
        }

        .message .bubble {
            padding: 12px 16px;
            border-radius: 2px;
            line-height: 1.6;
            font-size: 0.88rem;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-family: inherit;
        }

        .message.user .bubble {
            background: linear-gradient(135deg, #1c1c1c 0%, #121212 100%);
            border: 1px solid var(--border);
            border-right: 2px solid var(--accent);
            color: var(--text);
        }

        .message.assistant .bubble {
            background: linear-gradient(135deg, rgba(255, 69, 0, 0.04) 0%, transparent 100%);
            border-left: 2px solid var(--accent);
            color: var(--text);
            padding-left: 18px;
        }

        .message.assistant .bubble code {
            background: var(--grad-dark);
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 0.82rem;
            color: var(--accent-light);
            border: 1px solid var(--border);
        }

        .message.assistant .bubble pre {
            background: var(--grad-dark);
            padding: 12px;
            border-radius: 2px;
            overflow-x: auto;
            margin: 10px 0;
            border: 1px solid var(--border);
            border-left: 2px solid var(--accent);
        }

        .input-area {
            padding: 16px 20px;
            background: linear-gradient(180deg, #121212 0%, #181818 100%);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            position: relative;
            z-index: 2;
        }

        .input-area textarea {
            flex: 1;
            background: var(--grad-dark);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 12px 14px;
            font-size: 0.88rem;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 140px;
            line-height: 1.5;
            transition: border-color 0.2s, box-shadow 0.3s;
        }

        .input-area textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(255, 107, 26, 0.15), 0 0 30px rgba(255, 107, 26, 0.12);
        }

        .input-area textarea::placeholder { color: var(--text-muted); }

        .input-area button {
            background: var(--grad-accent);
            background-size: 300% 300%;
            color: var(--bg);
            border: none;
            border-radius: 2px;
            padding: 12px 22px;
            font-size: 0.82rem;
            font-family: inherit;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            min-height: 44px;
            transition: transform 0.1s, box-shadow 0.3s;
            animation: gradShift 3s ease infinite;
        }

        .input-area button:hover:not(:disabled) {
            box-shadow: 0 0 35px rgba(255, 107, 26, 0.6);
        }

        .input-area button:active:not(:disabled) { transform: scale(0.94); }
        .input-area button:disabled { opacity: 0.3; cursor: not-allowed; animation: none; }

        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 12px 16px 12px 20px;
            align-self: flex-start;
            border-left: 2px solid var(--accent);
            margin-left: 42px;
        }

        .typing-indicator span {
            width: 6px; height: 6px;
            background: var(--grad-accent);
            border-radius: 1px;
            animation: bounce 1.2s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.24s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.12s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6) translateY(0); opacity: 0.3; }
            40% { transform: scale(1.3) translateY(-4px); opacity: 1; }
        }

        .cursor-blink {
            display: inline-block;
            width: 7px; height: 14px;
            background: var(--grad-accent);
            vertical-align: middle;
            animation: blink 1s step-end infinite;
            margin-left: 2px;
        }

        @keyframes blink { 50% { opacity: 0; } }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--border);
            overflow: hidden;
            z-index: 5;
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: var(--grad-accent);
            transition: width 0.3s;
            box-shadow: 0 0 12px var(--accent);
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.7rem;
            color: var(--text-muted);
            pointer-events: none;
            z-index: 6;
        }

        .welcome-box {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
            line-height: 1.8;
        }

        .welcome-box strong {
            color: var(--accent);
            display: block;
            margin-bottom: 8px;
        }

        @media (max-width: 600px) {
            body { padding: 0; }
            body::before, body::after, .scanline, .orb, .particles { display: none; }
            .app { height: 100vh; max-width: 100%; border-radius: 0; }
            .app::before { display: none; }
            .header { padding: 12px 14px; }
            .brand h1 { font-size: 0.8rem; letter-spacing: 2px; }
            .brand-logo { width: 28px; height: 28px; }
            #messages { padding: 16px 14px; }
            .message { max-width: 94%; }
            .input-area { padding: 12px 14px; }
            .status { display: none; }
            .controls select { max-width: 140px; }
        }
    </style>
</head>
<body>

    <div class="scanline"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="particles" id="particles"></div>

    <div class="app">
        <div class="header">
            <div class="brand">
                <svg class="brand-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <g stroke="#ff6b1a" stroke-width="3" stroke-linecap="round" fill="none">
                        <line x1="50" y1="50" x2="50" y2="6" />
                        <line x1="50" y1="50" x2="50" y2="94" />
                        <line x1="50" y1="50" x2="6" y2="50" />
                        <line x1="50" y1="50" x2="94" y2="50" />
                        <line x1="50" y1="50" x2="18" y2="18" />
                        <line x1="50" y1="50" x2="82" y2="82" />
                        <line x1="50" y1="50" x2="82" y2="18" />
                        <line x1="50" y1="50" x2="18" y2="82" />
                    </g>
                    <line x1="14" y1="86" x2="86" y2="14" stroke="#ff4500" stroke-width="4" stroke-linecap="square"/>
                </svg>
                <h1>WEBLLM</h1>
            </div>
            <div class="controls">
                <select id="modelSelect" title="Модель">
                    <option value="">Выбери модель...</option>
                </select>
                <button id="loadBtn" disabled>Загрузить</button>
                <button id="resetBtn">Сброс</button>
                <span id="status" class="status">Не загружено</span>
            </div>
        </div>

        <div id="messages">
            <div class="welcome-box" id="welcomeBox">
                <strong>WebLLM Chat</strong>
                Модель работает локально в браузере через WebGPU.<br>
                Выбери модель из списка и нажми «Загрузить».<br>
                Первая загрузка может занять 1-2 минуты (скачивание в кэш).<br>
                Дальше работает офлайн и мгновенно.<br><br>
                <span style="color: var(--accent-dim);">Требуется Chrome/Edge 113+ с поддержкой WebGPU.</span>
            </div>
        </div>

        <div class="input-area">
            <textarea id="inputMessage" placeholder="Сообщение..." rows="1" disabled></textarea>
            <button id="sendButton" disabled>Send</button>
        </div>

        <div class="progress-bar" id="progressBar" style="display: none;">
            <div class="fill" id="progressFill"></div>
        </div>
    </div>

    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm@0.2.79";

        // === Модели для выбора (из официального каталога WebLLM) ===
        const MODELS = [
            { id: 'SmolLM2-360M-Instruct-q4f16_1-MLC', name: 'SmolLM2 360M (210 MB)', size: '210 MB', desc: 'Крошечная, грузится мгновенно' },
            { id: 'Qwen2.5-0.5B-Instruct-q4f16_1-MLC', name: 'Qwen 2.5 0.5B (278 MB)', size: '278 MB', desc: 'Мини Qwen, хорошее качество' },
            { id: 'Llama-3.2-1B-Instruct-q4f16_1-MLC', name: 'Llama 3.2 1B (712 MB)', size: '712 MB', desc: 'Для простых задач' },
            { id: 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC', name: 'Qwen 2.5 1.5B (868 MB)', size: '868 MB', desc: 'Мультиязычная' },
            { id: 'gemma-2-2b-it-q4f16_1-MLC', name: 'Gemma 2 2B (1.4 GB)', size: '1.4 GB', desc: 'Google Gemma, требует shader-f16' },
            { id: 'Llama-3.2-3B-Instruct-q4f16_1-MLC', name: 'Llama 3.2 3B (1.76 GB)', size: '1.76 GB', desc: 'Отличное качество для размера' },
            { id: 'Phi-3.5-mini-instruct-q4f16_1-MLC', name: 'Phi 3.5 Mini (2.1 GB)', size: '2.1 GB', desc: 'Reasoning и код' },
            { id: 'Mistral-7B-Instruct-v0.3-q4f16_1-MLC', name: 'Mistral 7B (4 GB)', size: '4 GB', desc: 'Мощная, для 8GB+ VRAM' },
            { id: 'Qwen2.5-7B-Instruct-q4f16_1-MLC', name: 'Qwen 2.5 7B (4 GB)', size: '4 GB', desc: 'Лучшая мультиязычная' },
        ];

        // === DOM ===
        const modelSelect = document.getElementById('modelSelect');
        const loadBtn = document.getElementById('loadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const statusEl = document.getElementById('status');
        const messagesContainer = document.getElementById('messages');
        const welcomeBox = document.getElementById('welcomeBox');
        const inputMessage = document.getElementById('inputMessage');
        const sendButton = document.getElementById('sendButton');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        let engine = null;
        let conversationHistory = [];
        let isGenerating = false;

        // === Проверка WebGPU ===
        if (!navigator.gpu) {
            statusEl.textContent = 'Нет WebGPU';
            statusEl.className = 'status offline';
            addSystemMessage('❌ WebGPU не поддерживается. Нужен Chrome/Edge 113+ или Safari 26+. Проверь chrome://gpu');
        } else {
            statusEl.textContent = 'Готов';
            statusEl.className = 'status online';
        }

            opt.title = m.desc;
            modelSelect.appendChild(opt);
        });

            loadBtn.disabled = true;
            modelSelect.disabled = true;
            sendButton.disabled = true;
            inputMessage.disabled = true;
            statusEl.textContent = 'Загрузка...';
            statusEl.className = 'status loading';

            // Убираем welcome
            if (welcomeBox) welcomeBox.remove();

            addSystemMessage(`⏳ Загружаю ${modelId}... Первый раз может занять 1-2 минуты (скачивание модели).`);

            try {
                engine = await webllm.CreateMLCEngine(modelId, {
                    initProgressCallback: (progress) => {
                        const percent = Math.floor((progress.progress || 0) * 100);
                        progressBar.style.display = 'block';
                        progressFill.style.width = percent + '%';
                        statusEl.textContent = `Загрузка ${percent}%`;
                        if (progress.text) {
                            // можно показать текст прогресса
                        }
                    }
                });

                progressBar.style.display = 'none';
                statusEl.textContent = 'Готов';
                statusEl.className = 'status online';
                loadBtn.disabled = false;
                modelSelect.disabled = false;
                sendButton.disabled = false;
                inputMessage.disabled = false;
                inputMessage.focus();

                addSystemMessage(`✅ Модель ${modelId} загружена. Пиши запрос.`);

            } catch (err) {
                console.error(err);
                statusEl.textContent = 'Ошибка';
                statusEl.className = 'status offline';
                progressBar.style.display = 'none';
                loadBtn.disabled = false;
                modelSelect.disabled = false;
                addSystemMessage(`❌ Ошибка загрузки: ${err.message}`);
            }
        }

        loadBtn.addEventListener('click', loadModel);
        modelSelect.addEventListener('change', () => {
            loadBtn.disabled = !modelSelect.value || !!engine;
        });
